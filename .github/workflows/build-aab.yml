name: Build SERVIQO AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks
          echo "Keystore restored successfully"
          ls -lh upload-keystore.jks

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '%s\n' "$JAVA_HOME" > "$HOME/.bubblewrap/java-home"

      - name: Generate Android project
        env:
          CI: true
          JAVA_HOME: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_JAVA_HOME: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_SKIP_JDK_DOWNLOAD: "true"
        run: |
          bubblewrap update --manifest=twa-manifest.json

      - name: Build AAB
        env:
          CI: true
          JAVA_HOME: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_JAVA_HOME: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_SKIP_JDK_DOWNLOAD: "true"
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          bubblewrap build

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SERVIQO-AAB
          path: |
            **/*.aab
